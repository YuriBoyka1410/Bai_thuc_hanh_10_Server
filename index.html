<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bai thuc hanh 10</title>
  </head>
  <body>
    <script>
      //Nhiệm vụ 1: Đồng bộ dữ liệu

      function syncOrder() {
        let attempts = 0;
        const maxAttempt = 5;
        console.log("Bắt đầu đồng bộ...");

        while (attempts < maxAttempt) {
          let networkError = true;
          if (networkError) {
            console.log(`Lỗi mạng lần ${attempts + 1}, thử lại...`);
            attempts++;
            continue;
          }
          console.log("Đồng bộ thành công!");
          break;
        }
      }
      //Nhiệm vụ 2: Tìm đơn hàng trùng
      function findDuplicateOrders(orders) {
        const duplicates = [];
        let iterations = 0;
        for (let i = 0; i < orders.length; i++) {
          for (let j = i + 1; j < orders.length; j++) {
            iterations++;
            if (orders[i] === orders[j]) {
              if (!duplicates.includes(orders[i])) {
                duplicates.push(orders[i]);
              }
              break;
            }
          }
        }
        console.log(`Tổng số bước lặp (Mới): ${iterations}`);
        return duplicates;
      }

      //Tạo dữ liệu test lớn
      const largeOrder = Array.from(
        { length: 2000 },
        (_, i) => `VN${i % 15000}`,
      );

      //Test nhiệm vụ 1
      syncOrder();
      //Test nhiệm vụ 2
      console.time("Duplicate Scan");
      const duplicates = findDuplicateOrders(largeOrder);
      console.timeEnd("Duplicate Scan");

      console.log("Số đơn hàng trùng: ", duplicates.length);
      console.log("Một vài đơn hàng trùng đầu tiên: ");
      console.log(duplicates.slice(0, 10));

      // TEST NHỎ ĐỂ KIỂM TRA KẾT QUẢ
      // =========================

      const dummyOrders = [
        "VN123",
        "VN456",
        "VN789",
        "VN123",
        "VN999",
        "VN456",
      ];

      console.log("Đơn hàng trùng:", findDuplicateOrders(dummyOrders));
    </script>
  </body>
</html>
